<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GemDefense MVP</title>
    <style>
        /* NUCLEAR OPTION: DISABLE ALL DEFAULT BROWSER INTERACTIONS */
        * {
            touch-action: none; /* Disables pinch-zoom and pan on touch devices */
            -webkit-touch-callout: none;
            -webkit-user-select: none; /* Disables text selection on Safari */
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; /* Disables text selection on Chrome/Edge */
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overscroll-behavior: none; /* Prevents "bounce" effect on Mac/iOS */
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: row;
            border: 2px solid #333;
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        #ui-sidebar {
            width: 300px;
            background: #222;
            border-left: 2px solid #444;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
        }

        .panel {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
        }

        .panel h3 {
            margin: 0 0 10px 0;
            color: #ff9800;
            font-size: 16px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        button {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-weight: bold;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background: #444;
            border-color: #777;
        }

        button.active {
            background: #ff9800;
            color: black;
            border-color: #ffb74d;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .gem-btn {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        #log-panel {
            flex-grow: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            max-height: 200px;
            pointer-events: auto; /* Allow scrolling in log only */
            touch-action: pan-y;
        }

        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .log-info { color: #81d4fa; }
        .log-warn { color: #ffcc80; }
        .log-err { color: #ef9a9a; }
        .log-success { color: #a5d6a7; }
        .log-sys { color: #b39ddb; font-style: italic; }

        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #666;
            padding: 8px;
            pointer-events: none;
            display: none;
            z-index: 100;
            font-size: 12px;
            white-space: pre-line;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            min-width: 120px;
        }

        .instruction {
            color: #aaa;
            font-size: 0.85em;
            text-align: center;
            font-style: italic;
            margin-bottom: 5px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="game-container">
        <!-- Draggable=false is critical to stop the "Ghost Image" effect -->
        <canvas id="gameCanvas" width="800" height="700" draggable="false"></canvas>
        <div id="ui-sidebar">
            <div class="panel">
                <h3>Player Stats</h3>
                <div class="stat-row"><span>Mana:</span> <span id="val-mana" style="color:#4fc3f7">0</span></div>
                <div class="stat-row"><span>Lives:</span> <span id="val-lives" style="color:#ef5350">0</span></div>
                <div class="stat-row"><span>Wave:</span> <span id="val-wave">0</span></div>
                <button id="btn-next-wave" style="width:100%; margin-top:5px;">Call Wave (N)</button>
            </div>

            <div class="panel">
                <h3>Build Structure</h3>
                <div class="instruction">Click to Select Mode</div>
                <div class="btn-group">
                    <button id="btn-build-tower" onclick="Game.setMode('BUILD_TOWER')" draggable="false">Tower (100)</button>
                    <button id="btn-build-trap" onclick="Game.setMode('BUILD_TRAP')" draggable="false">Trap (80)</button>
                    <button id="btn-build-amp" onclick="Game.setMode('BUILD_AMP')" draggable="false">Amp (150)</button>
                    <button id="btn-build-wall" onclick="Game.setMode('BUILD_WALL')" draggable="false">Wall (20)</button>
                </div>
            </div>

            <div class="panel">
                <h3>Craft Gem (Grade 1)</h3>
                <div class="instruction" style="color:#ffcc80">1. Click Button to Craft<br>2. Drag from Bottom Inventory</div>
                <div class="btn-group">
                    <button class="gem-btn" style="border-color: #ff5252; color: #ff5252;" onclick="Game.craftGem('red')" draggable="false">Red (Chain)</button>
                    <button class="gem-btn" style="border-color: #ffeb3b; color: #ffeb3b;" onclick="Game.craftGem('yellow')" draggable="false">Yel (Crit)</button>
                    <button class="gem-btn" style="border-color: #4caf50; color: #4caf50;" onclick="Game.craftGem('green')" draggable="false">Grn (Pois)</button>
                    <button class="gem-btn" style="border-color: #448aff; color: #448aff;" onclick="Game.craftGem('blue')" draggable="false">Blu (Slow)</button>
                    <button class="gem-btn" style="border-color: #e040fb; color: #e040fb;" onclick="Game.craftGem('purple')" draggable="false">Pur (Armr)</button>
                    <button class="gem-btn" style="border-color: #ff9800; color: #ff9800;" onclick="Game.craftGem('orange')" draggable="false">Org (Mana)</button>
                </div>
                <div style="text-align: center; margin-top: 5px; font-size: 0.9em; color: #888;">Cost: <span id="gem-cost">100</span> Mana</div>
            </div>

            <div class="panel" style="flex-grow: 1; display: flex; flex-direction: column;">
                <h3>System Log</h3>
                <div id="log-panel"></div>
            </div>
        </div>
    </div>

    <div id="tooltip"></div>

<script>
// --- CONFIGURATION ---
const CONFIG = {
    TILE_SIZE: 40, GRID_W: 20, GRID_H: 15, FPS: 60,
    START_MANA: 2000, START_LIVES: 20,
    COLORS: {
        red: { name: "Ruby", special: "Chain Hit", color: "#ff5252" },
        yellow: { name: "Topaz", special: "Crit Chance", color: "#ffeb3b" },
        green: { name: "Emerald", special: "Poison", color: "#69f0ae" },
        blue: { name: "Aquamarine", special: "Slow", color: "#448aff" },
        purple: { name: "Amethyst", special: "Armor Tear", color: "#e040fb" },
        orange: { name: "Garnet", special: "Mana Leech", color: "#ff9800" },
        hybrid: { name: "Hybrid", special: "Mixed", color: "#ffffff" }
    },
    GEM_BASE_COST: 100,
    STRUCTURE_COST: { TOWER: 100, TRAP: 80, AMP: 150, WALL: 20 },
    COMBINE_HIGH: 0.87, COMBINE_LOW: 0.71, HYBRID_PENALTY: 0.7,
    WAVE: { HP_BASE: 80, HP_EXP: 1.1, HP_POLY: 10, ARMOR_BASE: 2, ARMOR_EXP: 1.5 }
};

// --- ECS CORE ---
class EntityManager {
    constructor() { this.entities = []; this.nextId = 1; this.toRemove = []; }
    createEntity() { const e = { id: this.nextId++, active: true, components: {} }; this.entities.push(e); return e; }
    addComponent(entity, name, data) { entity.components[name] = data; }
    getEntitiesWith(compNames) { return this.entities.filter(e => e.active && compNames.every(name => e.components[name])); }
    removeEntity(id) { this.toRemove.push(id); }
    cleanup() {
        if (this.toRemove.length > 0) {
            this.entities = this.entities.filter(e => !this.toRemove.includes(e.id));
            this.toRemove = [];
        }
    }
}
const ECS = new EntityManager();

// --- MATH UTILS ---
const MathUtils = {
    formatNumber: (num) => {
        if (num < 1000) return Math.floor(num).toString();
        if (num < 1000000) return (num / 1000).toFixed(1) + "K";
        if (num < 1e9) return (num / 1e6).toFixed(2) + "M";
        return (num / 1e9).toFixed(2) + "B";
    },
    dist: (x1, y1, x2, y2) => Math.sqrt((x2-x1)**2 + (y2-y1)**2),
    combineGems: (gemA, gemB) => {
        let newGrade = Math.max(gemA.grade, gemB.grade);
        if (gemA.grade === gemB.grade) newGrade += 1;
        const maxD = Math.max(gemA.damage, gemB.damage);
        const minD = Math.min(gemA.damage, gemB.damage);
        const newD = (CONFIG.COMBINE_HIGH * maxD) + (CONFIG.COMBINE_LOW * minD);
        const maxS = Math.max(gemA.specialVal, gemB.specialVal);
        const minS = Math.min(gemA.specialVal, gemB.specialVal);
        let rawS = (CONFIG.COMBINE_HIGH * maxS) + (CONFIG.COMBINE_LOW * minS);
        let newColor = gemA.color;
        let isHybrid = false;
        if (gemA.color !== gemB.color) { newColor = "hybrid"; rawS *= CONFIG.HYBRID_PENALTY; isHybrid = true; }
        return {
            grade: newGrade, damage: newD, specialVal: rawS, color: newColor,
            range: Math.max(gemA.range, gemB.range), fireRate: Math.max(gemA.fireRate, gemB.fireRate),
            cost: gemA.cost + gemB.cost, isHybrid: isHybrid, id: Date.now() + Math.random()
        };
    }
};

// --- GAME LOGIC ---
const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: document.getElementById('gameCanvas').getContext('2d'),
    state: {
        mana: CONFIG.START_MANA, lives: CONFIG.START_LIVES, wave: 0, mode: 'SELECT',
        inventory: Array(36).fill(null), enemiesPending: 0, spawnTimer: 0, waveActive: false,
        lastCraftedIdx: -1, // For flash effect
        drag: { active: false, gem: null, sourceType: null, sourceIndex: null, mouseX: 0, mouseY: 0 }
    },
    grid: [], path: [], effects: [],

    init() {
        this.initGrid();
        this.calculatePath();

        // --- INPUT HANDLING ---

        // 1. PREVENT NATIVE DRAG (The "Ghost Image" Fix)
        // This stops the browser from picking up the canvas as an image when you drag
        window.addEventListener('dragstart', (e) => e.preventDefault());

        // 2. Prevent Default Browser Gestures
        window.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('wheel', (e) => { if(e.ctrlKey) e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());

        // 3. Game Listeners
        this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
        this.canvas.addEventListener('touchstart', (e) => this.handleMouseDown(e), {passive: false});
        this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
        this.canvas.addEventListener('touchmove', (e) => this.handleMouseMove(e), {passive: false});

        window.addEventListener('mouseup', (e) => this.handleMouseUp(e));
        window.addEventListener('touchend', (e) => this.handleMouseUp(e), {passive: false});

        document.getElementById('btn-next-wave').addEventListener('click', () => this.startWave());

        this.updateUI();
        this.log("System Online. Click to Craft. Drag from Bottom.", "sys");
        requestAnimationFrame(() => this.loop());
    },

    initGrid() {
        for (let y = 0; y < CONFIG.GRID_H; y++) {
            const row = [];
            for (let x = 0; x < CONFIG.GRID_W; x++) row.push({ x, y, type: 'EMPTY', structureId: null });
            this.grid.push(row);
        }
        const setPath = (x, y) => { this.grid[y][x].type = 'PATH'; };
        // Simple Path
        for(let i=0; i<=5; i++) setPath(i, 2);
        for(let i=2; i<=8; i++) setPath(5, i);
        for(let i=5; i<=12; i++) setPath(i, 8);
        for(let i=8; i>=4; i--) setPath(12, i);
        for(let i=12; i<=18; i++) setPath(i, 4);
        for(let i=4; i<=12; i++) setPath(18, i);
        for(let i=18; i>=2; i--) setPath(i, 12);
        for(let i=12; i<CONFIG.GRID_H; i++) setPath(2, i);
        this.orbPos = {x: 2, y: 14}; this.spawnPos = {x: 0, y: 2};
    },

    calculatePath() {
        const queue = [this.spawnPos]; const cameFrom = {}; cameFrom[`${this.spawnPos.x},${this.spawnPos.y}`] = null;
        let found = false;
        while(queue.length > 0) {
            const current = queue.shift();
            if (current.x === this.orbPos.x && current.y === this.orbPos.y) { found = true; break; }
            const neighbors = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
            for (let n of neighbors) {
                const nx = current.x+n.x, ny = current.y+n.y;
                if (nx>=0 && nx<CONFIG.GRID_W && ny>=0 && ny<CONFIG.GRID_H) {
                    const tile = this.grid[ny][nx];
                    if (tile.type!=='WALL' && tile.type!=='STRUCTURE' && !(`${nx},${ny}` in cameFrom)) {
                        cameFrom[`${nx},${ny}`] = current; queue.push({x:nx, y:ny});
                    }
                }
            }
        }
        this.path = [];
        if (found) {
            let curr = this.orbPos;
            while(curr) { this.path.unshift(curr); curr = cameFrom[`${curr.x},${curr.y}`]; }
        }
    },

    startWave() {
        if(this.state.waveActive) return;
        this.state.wave++; this.state.waveActive = true;
        const w = this.state.wave;
        const hp = CONFIG.WAVE.HP_BASE * Math.pow(CONFIG.WAVE.HP_EXP, w) + (w*w*CONFIG.WAVE.HP_POLY);
        const armor = CONFIG.WAVE.ARMOR_BASE * Math.pow(w, 1.5);
        this.state.enemiesPending = 10 + Math.floor(w*0.5);
        this.state.currentWaveStats = { hp, armor, speed: 1.5, bounty: 5+w, interval: 40 };
        this.log(`Wave ${w} Started.`, 'warn');
        this.updateUI();
    },

    spawnEnemy() {
        if (this.state.enemiesPending <= 0) return;
        const stats = this.state.currentWaveStats;
        const e = ECS.createEntity();
        ECS.addComponent(e, 'transform', { x: this.spawnPos.x*CONFIG.TILE_SIZE+20, y: this.spawnPos.y*CONFIG.TILE_SIZE+20 });
        ECS.addComponent(e, 'stats', { hp: stats.hp, maxHp: stats.hp, armor: stats.armor, speed: stats.speed, bounty: stats.bounty, effects: [] });
        ECS.addComponent(e, 'pathFollower', { pathIndex: 0 });
        ECS.addComponent(e, 'render', { type: 'ENEMY', color: '#ff0000', radius: 12 });
        this.state.enemiesPending--;
    },

    updateEnemies() {
        const enemies = ECS.getEntitiesWith(['pathFollower', 'transform', 'stats']);
        enemies.forEach(e => {
            const stats = e.components.stats, pos = e.components.transform;
            let speedMod = 1.0;
            stats.effects = stats.effects.filter(eff => {
                eff.duration--;
                if (eff.type === 'SLOW') speedMod *= (1 - eff.power);
                if (eff.type === 'POISON' && eff.duration % 30 === 0) {
                     stats.hp -= eff.power; Game.createFloatingText(pos.x, pos.y, Math.floor(eff.power), '#00ff00');
                }
                return eff.duration > 0;
            });
            if (stats.hp <= 0) { this.state.mana += stats.bounty; ECS.removeEntity(e.id); this.updateUI(); return; }

            const idx = e.components.pathFollower.pathIndex;
            if (idx < this.path.length - 1) {
                const target = this.path[idx+1];
                const tx = target.x*CONFIG.TILE_SIZE+20, ty = target.y*CONFIG.TILE_SIZE+20;
                const dx = tx-pos.x, dy = ty-pos.y, dist = Math.sqrt(dx*dx+dy*dy);
                const step = stats.speed * speedMod;
                if (dist < step) { e.components.pathFollower.pathIndex++; pos.x = tx; pos.y = ty; }
                else { pos.x += (dx/dist)*step; pos.y += (dy/dist)*step; }
            } else {
                this.state.lives--; ECS.removeEntity(e.id); this.updateUI();
                if(this.state.lives <= 0) { this.state.lives = 0; this.log("GAME OVER", "err"); this.state.waveActive = false; }
            }
        });
    },

    updateStructures() {
        const structures = ECS.getEntitiesWith(['structure', 'transform']);
        const enemies = ECS.getEntitiesWith(['stats', 'transform']);
        structures.forEach(s => {
            const str = s.components.structure;
            if ((str.type === 'TOWER' || str.type === 'TRAP') && str.gem) {
                if (str.cooldown > 0) { str.cooldown--; return; }
                const stats = this.getEffectiveStats(s, str.gem);
                let target = null, minDist = stats.range * CONFIG.TILE_SIZE;
                for(let e of enemies) {
                    const d = MathUtils.dist(s.components.transform.x, s.components.transform.y, e.components.transform.x, e.components.transform.y);
                    if (d < minDist) { minDist = d; target = e; }
                }
                if (target) {
                    const p = ECS.createEntity();
                    ECS.addComponent(p, 'transform', { x: s.components.transform.x, y: s.components.transform.y });
                    ECS.addComponent(p, 'projectile', { targetId: target.id, speed: 8, damage: stats.damage, gemData: stats });
                    ECS.addComponent(p, 'render', { type: 'PROJECTILE', color: CONFIG.COLORS[stats.color].color });
                    str.cooldown = 60 / stats.fireRate;
                }
            }
        });
    },

    getEffectiveStats(structure, gem) {
        const stats = { ...gem, damage: gem.damage, fireRate: gem.fireRate }; // Clone
        const tx = Math.floor(structure.components.transform.x/CONFIG.TILE_SIZE), ty = Math.floor(structure.components.transform.y/CONFIG.TILE_SIZE);
        for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++) {
            if(dx===0 && dy===0) continue;
            const nx = tx+dx, ny = ty+dy;
            if(nx>=0 && nx<CONFIG.GRID_W && ny>=0 && ny<CONFIG.GRID_H) {
                const t = this.grid[ny][nx];
                if(t.structureId) {
                    const n = ECS.entities.find(e => e.id === t.structureId);
                    if(n && n.components.structure.type === 'AMP' && n.components.structure.gem) {
                        const ag = n.components.structure.gem;
                        stats.damage += ag.damage * 0.15; stats.fireRate += ag.fireRate * 0.15; stats.specialVal += ag.specialVal * 0.15;
                    }
                }
            }
        }
        return stats;
    },

    updateProjectiles() {
        const projs = ECS.getEntitiesWith(['projectile', 'transform']);
        projs.forEach(p => {
            const pd = p.components.projectile;
            const target = ECS.entities.find(e => e.id === pd.targetId);
            if (!target || !target.active) { ECS.removeEntity(p.id); return; }
            const pos = p.components.transform, tpos = target.components.transform;
            const d = MathUtils.dist(pos.x, pos.y, tpos.x, tpos.y);
            if (d < pd.speed) {
                const s = target.components.stats;
                let dmg = Math.max(1, pd.damage - s.armor);
                if (pd.gemData.color === 'yellow' && Math.random() < 0.2) { dmg *= pd.gemData.specialVal; this.createFloatingText(tpos.x, tpos.y-20, "CRIT", "#ffeb3b"); }
                else if (pd.gemData.color === 'purple') s.armor = Math.max(0, s.armor - pd.gemData.specialVal);
                else if (pd.gemData.color === 'orange') { this.state.mana += pd.gemData.specialVal; this.updateUI(); }
                else if (pd.gemData.color === 'blue' && !s.effects.find(e=>e.type==='SLOW')) s.effects.push({type:'SLOW', power: pd.gemData.specialVal, duration: 120});
                else if (pd.gemData.color === 'green') s.effects.push({type:'POISON', power: pd.gemData.specialVal, duration: 180});
                s.hp -= dmg;
                this.createFloatingText(tpos.x, tpos.y, MathUtils.formatNumber(dmg), '#fff');
                ECS.removeEntity(p.id);
            } else {
                const dx = tpos.x-pos.x, dy = tpos.y-pos.y;
                pos.x += (dx/d)*pd.speed; pos.y += (dy/d)*pd.speed;
            }
        });
    },

    createFloatingText(x, y, text, color) { this.effects.push({x, y, text, color, life: 30}); },

    loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        if (this.state.waveActive) {
            if (this.state.enemiesPending > 0) {
                this.state.spawnTimer++;
                if (this.state.spawnTimer >= this.state.currentWaveStats.interval) { this.spawnEnemy(); this.state.spawnTimer = 0; }
            } else if (ECS.getEntitiesWith(['stats']).length === 0) {
                this.state.waveActive = false; this.log("Wave Cleared.", 'success');
            }
        }

        this.updateEnemies(); this.updateStructures(); this.updateProjectiles(); ECS.cleanup();
        this.drawGrid(); this.drawEntities(); this.drawEffects(); this.drawInventory(); this.drawDrag();
        requestAnimationFrame(() => this.loop());
    },

    drawEntities() {
        ECS.entities.forEach(e => {
            if(!e.active) return;
            const r = e.components.render, t = e.components.transform;
            if(r && t) {
                this.ctx.fillStyle = r.color;
                if(r.type === 'ENEMY') {
                    this.ctx.beginPath(); this.ctx.arc(t.x, t.y, r.radius, 0, Math.PI*2); this.ctx.fill();
                    const s = e.components.stats;
                    this.ctx.fillStyle = 'red'; this.ctx.fillRect(t.x-10, t.y-18, 20, 4);
                    this.ctx.fillStyle = '#0f0'; this.ctx.fillRect(t.x-10, t.y-18, 20*(Math.max(0,s.hp/s.maxHp)), 4);
                } else {
                    this.ctx.beginPath(); this.ctx.arc(t.x, t.y, 3, 0, Math.PI*2); this.ctx.fill();
                }
            }
        });
    },

    drawGrid() {
        for(let y=0; y<CONFIG.GRID_H; y++) for(let x=0; x<CONFIG.GRID_W; x++) {
            const tile = this.grid[y][x];
            const px = x * CONFIG.TILE_SIZE, py = y * CONFIG.TILE_SIZE;
            this.ctx.strokeStyle = '#333'; this.ctx.strokeRect(px, py, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
            if(tile.type === 'PATH') { this.ctx.fillStyle = '#111'; this.ctx.fillRect(px, py, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE); }
            else if(tile.type === 'WALL') { this.ctx.fillStyle = '#444'; this.ctx.fillRect(px+2, py+2, CONFIG.TILE_SIZE-4, CONFIG.TILE_SIZE-4); }

            if(tile.structureId) {
                const s = ECS.entities.find(e => e.id === tile.structureId);
                if(s) {
                    const sd = s.components.structure;
                    this.ctx.fillStyle = sd.type === 'AMP' ? '#555' : '#777';
                    this.ctx.fillRect(px+4, py+4, CONFIG.TILE_SIZE-8, CONFIG.TILE_SIZE-8);
                    this.ctx.fillStyle = '#000'; this.ctx.textAlign = 'center'; this.ctx.font = "bold 16px Arial";
                    this.ctx.fillText(sd.type==='TOWER'?'T':(sd.type==='TRAP'?'R':'A'), px+20, py+26);
                    if(sd.gem && !(this.state.drag.active && this.state.drag.sourceType==='STRUCTURE' && this.state.drag.sourceIndex===s.id)) {
                        this.drawGemShape(px+20, py+15, sd.gem, 10);
                    }
                }
            }
        }
        this.ctx.fillStyle = '#00b0ff'; this.ctx.beginPath(); this.ctx.arc(this.orbPos.x*CONFIG.TILE_SIZE+20, this.orbPos.y*CONFIG.TILE_SIZE+20, 15, 0, Math.PI*2); this.ctx.fill();
    },

    drawInventory() {
        const startX = 20, startY = 620, slotSize = 40, gap = 5;
        this.ctx.fillStyle = '#222'; this.ctx.fillRect(0, 600, 800, 100);
        this.ctx.strokeStyle = '#444'; this.ctx.beginPath(); this.ctx.moveTo(0,600); this.ctx.lineTo(800,600); this.ctx.stroke();
        this.ctx.fillStyle = '#ccc'; this.ctx.font = "14px Arial"; this.ctx.textAlign = "left"; this.ctx.fillText("INVENTORY (Drag Gems from Here)", 20, 615);

        for(let i=0; i<36; i++) {
            const x = startX + (i%12)*(slotSize+gap), y = startY + Math.floor(i/12)*(slotSize+gap);
            this.ctx.strokeStyle = '#555'; this.ctx.lineWidth = 1;

            // Flash Effect
            if (i === this.state.lastCraftedIdx) {
                this.ctx.fillStyle = `rgba(255, 255, 255, ${(Math.sin(Date.now()/100)+1)/2 * 0.5})`;
                this.ctx.fillRect(x, y, slotSize, slotSize);
            }

            this.ctx.strokeRect(x, y, slotSize, slotSize);
            const gem = this.state.inventory[i];
            if(gem && !(this.state.drag.active && this.state.drag.sourceType==='INVENTORY' && this.state.drag.sourceIndex===i)) {
                this.drawGemShape(x+20, y+20, gem, 14);
                this.ctx.fillStyle = '#fff'; this.ctx.textAlign = 'center'; this.ctx.font = "10px monospace"; this.ctx.fillText(gem.grade, x+20, y+36);
            }
        }
        if (this.state.lastCraftedIdx !== -1 && Math.random() < 0.05) this.state.lastCraftedIdx = -1; // End flash
    },

    drawDrag() {
        if(this.state.drag.active && this.state.drag.gem) {
            this.drawGemShape(this.state.drag.mouseX, this.state.drag.mouseY, this.state.drag.gem, 16);
        }
    },

    drawEffects() {
        this.ctx.font = "12px monospace";
        this.effects = this.effects.filter(e => e.life > 0);
        this.effects.forEach(e => {
            this.ctx.fillStyle = e.color; this.ctx.fillText(e.text, e.x, e.y); e.y -= 0.5; e.life--;
        });
    },

    // Shape drawing strategies - cleaner and more maintainable
    gemShapes: {
        1: function(ctx, x, y, size) {
            // Triangle
            ctx.moveTo(x, y - size);
            ctx.lineTo(x + size, y + size);
            ctx.lineTo(x - size, y + size);
        },
        2: function(ctx, x, y, size) {
            // Square
            ctx.rect(x - size, y - size, size * 2, size * 2);
        },
        3: function(ctx, x, y, size) {
            // Diamond
            ctx.moveTo(x, y - size * 1.2);
            ctx.lineTo(x + size * 1.2, y);
            ctx.lineTo(x, y + size * 1.2);
            ctx.lineTo(x - size * 1.2, y);
        },
        4: function(ctx, x, y, size) {
            // Pentagon
            const sides = 5;
            const angleOffset = -Math.PI / 2;
            for (let i = 0; i < sides; i++) {
                const angle = (Math.PI * 2 * i / sides) + angleOffset;
                const px = x + size * Math.cos(angle);
                const py = y + size * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
        },
        5: function(ctx, x, y, size) {
            // Hexagon
            const sides = 6;
            for (let i = 0; i < sides; i++) {
                const angle = Math.PI * 2 * i / sides;
                const px = x + size * Math.cos(angle);
                const py = y + size * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
        },
        default: function(ctx, x, y, size) {
            // Star (for grade 6+)
            const outerRadius = size;
            const innerRadius = size / 2;
            const points = 8;
            let rotation = Math.PI * 3 / 2;
            const step = Math.PI / points;

            ctx.moveTo(x, y - outerRadius);
            for (let i = 0; i < points; i++) {
                // Outer point
                let px = x + Math.cos(rotation) * outerRadius;
                let py = y + Math.sin(rotation) * outerRadius;
                ctx.lineTo(px, py);
                rotation += step;

                // Inner point
                px = x + Math.cos(rotation) * innerRadius;
                py = y + Math.sin(rotation) * innerRadius;
                ctx.lineTo(px, py);
                rotation += step;
            }
        }
    },

    drawGemShape(x, y, gem, size) {
        // Set fill and stroke styles
        this.ctx.fillStyle = CONFIG.COLORS[gem.color].color;
        this.ctx.strokeStyle = '#000';
        this.ctx.lineWidth = 1;

        // Draw the gem shape based on grade
        this.ctx.beginPath();
        const shapeDrawer = this.gemShapes[gem.grade] || this.gemShapes.default;
        shapeDrawer(this.ctx, x, y, size);
        this.ctx.closePath();
        this.ctx.fill();
        this.ctx.stroke();

        // Add highlight effect
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        this.ctx.beginPath();
        this.ctx.arc(x - size * 0.3, y - size * 0.3, size * 0.2, 0, Math.PI * 2);
        this.ctx.fill();
    },

    // --- INPUT ---
    getCoords(e) {
        const r = this.canvas.getBoundingClientRect();
        const sx = this.canvas.width/r.width, sy = this.canvas.height/r.height;
        let cx = e.clientX, cy = e.clientY;
        if(e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        else if(e.changedTouches && e.changedTouches.length) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
        return { x: (cx - r.left)*sx, y: (cy - r.top)*sy };
    },

    handleMouseDown(e) {
        if(e.cancelable) e.preventDefault();
        const {x, y} = this.getCoords(e);

        // 1. Inventory Drag
        if (y > 600) {
            const sx = 20, sy = 620, sz = 40, gap = 5;
            for(let i=0; i<36; i++) {
                const bx = sx+(i%12)*(sz+gap), by = sy+Math.floor(i/12)*(sz+gap);
                if (x>=bx && x<=bx+sz && y>=by && y<=by+sz) {
                    const gem = this.state.inventory[i];
                    if(gem) this.state.drag = { active: true, gem: gem, sourceType: 'INVENTORY', sourceIndex: i, mouseX: x, mouseY: y };
                    return;
                }
            }
        }
        // 2. Grid Interaction
        else {
            const tx = Math.floor(x/CONFIG.TILE_SIZE), ty = Math.floor(y/CONFIG.TILE_SIZE);
            if(tx>=0 && tx<CONFIG.GRID_W && ty>=0 && ty<CONFIG.GRID_H) {
                const tile = this.grid[ty][tx];
                if(tile.structureId) {
                    const s = ECS.entities.find(e => e.id === tile.structureId);
                    if(s && s.components.structure.gem) {
                        this.state.drag = { active: true, gem: s.components.structure.gem, sourceType: 'STRUCTURE', sourceIndex: s.id, mouseX: x, mouseY: y };
                        return;
                    }
                }
                if(this.state.mode.startsWith('BUILD')) this.handleBuildClick(tx, ty);
            }
        }
    },

    handleMouseMove(e) {
        if(e.cancelable) e.preventDefault();
        const {x, y} = this.getCoords(e);
        this.state.drag.mouseX = x; this.state.drag.mouseY = y;
        // Tooltip logic omitted for brevity, drag prevents tooltip anyway
    },

    handleMouseUp(e) {
        if(e.cancelable) e.preventDefault();
        if(!this.state.drag.active) return;
        const {x, y} = this.getCoords(e);
        const drag = this.state.drag;
        this.state.drag = { active: false, gem: null, sourceType: null, sourceIndex: null, mouseX:0, mouseY:0 };

        // Drop on Inventory
        if (y > 600) {
            const sx = 20, sy = 620, sz = 40, gap = 5;
            for(let i=0; i<36; i++) {
                const bx = sx+(i%12)*(sz+gap), by = sy+Math.floor(i/12)*(sz+gap);
                if (x>=bx && x<=bx+sz && y>=by && y<=by+sz) { this.handleDropInventory(i, drag); return; }
            }
        }
        // Drop on Structure
        else {
            const tx = Math.floor(x/CONFIG.TILE_SIZE), ty = Math.floor(y/CONFIG.TILE_SIZE);
            if(tx>=0 && tx<CONFIG.GRID_W && ty>=0 && ty<CONFIG.GRID_H) {
                const tile = this.grid[ty][tx];
                if(tile.structureId) this.handleDropStructure(tile.structureId, drag);
            }
        }
    },

    handleDropInventory(targetIdx, drag) {
        const targetGem = this.state.inventory[targetIdx];
        let sourceGem = null;
        if (drag.sourceType === 'INVENTORY') {
            sourceGem = this.state.inventory[drag.sourceIndex];
            if (drag.sourceIndex === targetIdx) return;
            this.state.inventory[drag.sourceIndex] = null;
        } else { // STRUCTURE
            const s = ECS.entities.find(e => e.id === drag.sourceIndex);
            sourceGem = s.components.structure.gem;
            s.components.structure.gem = null;
        }

        if (targetGem) {
            const newGem = MathUtils.combineGems(sourceGem, targetGem);
            this.state.inventory[targetIdx] = newGem;
            this.log(`Fused Grade ${newGem.grade} ${newGem.color}`, 'success');
        } else {
            this.state.inventory[targetIdx] = sourceGem;
        }
    },

    handleDropStructure(sid, drag) {
        const s = ECS.entities.find(e => e.id === sid);
        let sourceGem = null;

        // Remove from source
        if(drag.sourceType === 'INVENTORY') {
            sourceGem = this.state.inventory[drag.sourceIndex];
            this.state.inventory[drag.sourceIndex] = null;
        } else { // STRUCTURE
            if(sid === drag.sourceIndex) return; // Self drop
            const srcS = ECS.entities.find(e => e.id === drag.sourceIndex);
            sourceGem = srcS.components.structure.gem;
            srcS.components.structure.gem = null;
        }

        // Handle target
        if(s.components.structure.gem) {
            // Swap or Combine? Let's Swap to prevent accidental loss
            if(drag.sourceType === 'INVENTORY') this.state.inventory[drag.sourceIndex] = s.components.structure.gem;
            else {
                 const srcS = ECS.entities.find(e => e.id === drag.sourceIndex);
                 srcS.components.structure.gem = s.components.structure.gem;
            }
            this.log("Gems Swapped", 'info');
        } else {
            this.log("Gem Socketed", 'success');
        }
        s.components.structure.gem = sourceGem;
    },

    handleBuildClick(tx, ty) {
        const tile = this.grid[ty][tx];
        const type = this.state.mode.split('_')[1];
        if (tile.type === 'STRUCTURE') { this.log("Occupied!", 'warn'); return; }
        if (type === 'TRAP' && tile.type !== 'PATH') { this.log("Traps need Path", 'warn'); return; }
        if (type !== 'TRAP' && tile.type !== 'EMPTY') { this.log("Invalid terrain", 'warn'); return; }

        const cost = CONFIG.STRUCTURE_COST[type];
        if (this.state.mana >= cost) {
            this.state.mana -= cost;
            const s = ECS.createEntity();
            ECS.addComponent(s, 'transform', { x: tx*CONFIG.TILE_SIZE+20, y: ty*CONFIG.TILE_SIZE+20 });
            ECS.addComponent(s, 'structure', { type: type, gem: null, cooldown: 0 });
            tile.structureId = s.id; tile.type = 'STRUCTURE';
            this.log(`Built ${type}`, 'success');
            this.updateUI(); this.state.mode = 'SELECT';
            document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        } else { this.log("Not enough Mana", 'err'); }
    },

    craftGem(color) {
        if (this.state.mana >= CONFIG.GEM_BASE_COST) {
            const idx = this.state.inventory.findIndex(s => s === null);
            if (idx === -1) { this.log("Inventory Full", 'err'); return; }
            this.state.mana -= CONFIG.GEM_BASE_COST;
            const def = CONFIG.COLORS[color];
            const g = {
                id: Date.now() + Math.random(), grade: 1, color: color,
                damage: color==='red'?90:(color==='yellow'?80:70), specialVal: color==='yellow'?3:(color==='blue'?0.2:5),
                range: 3.5, fireRate: 1.0, cost: CONFIG.GEM_BASE_COST
            };
            if(color==='orange') g.specialVal = 4;
            this.state.inventory[idx] = g;
            this.state.lastCraftedIdx = idx; // Trigger flash
            this.updateUI();
            this.log(`Crafted ${def.name}`, 'info');
        }
    },

    setMode(m) { this.state.mode = m; document.querySelectorAll('button').forEach(b=>b.classList.remove('active')); if(m.startsWith('BUILD')) document.getElementById('btn-'+m.toLowerCase().replace('_','-')).classList.add('active'); },
    log(msg, type='info') { const p = document.getElementById('log-panel'); const d = document.createElement('div'); d.className = `log-entry log-${type}`; d.textContent = `> ${msg}`; p.prepend(d); },
    updateUI() { document.getElementById('val-mana').textContent = Math.floor(this.state.mana); document.getElementById('val-lives').textContent = this.state.lives; document.getElementById('val-wave').textContent = this.state.wave; }
};

window.onload = () => Game.init();
</script>
